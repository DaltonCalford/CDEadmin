<text x="378" y="135" font-family="Fira Code, monospace" font-size="9" font-weight="600" fill="#CAF0F8" text-anchor="start">ScratchBird native (SBsql) · Cross-surface query · Engine authorization required</text>
<text x="364" y="174" font-family="Fira Code, monospace" font-size="8" font-weight="700" fill="#A2A6C9" text-anchor="start">QUERY</text>
<rect x="364" y="184" width="708" height="142" fill="#060A2D" stroke="#57679F" stroke-width="1"/>
<text x="380" y="210" font-family="Fira Code, monospace" font-size="10" font-weight="400" fill="#EDF2FB" text-anchor="start">SELECT p.customer_id, m.segment</text>
<text x="380" y="234" font-family="Fira Code, monospace" font-size="10" font-weight="400" fill="#EDF2FB" text-anchor="start">FROM emulated.postgresql.public.customer p</text>
<text x="380" y="258" font-family="Fira Code, monospace" font-size="10" font-weight="400" fill="#EDF2FB" text-anchor="start">JOIN emulated.mysql.sales.segment m ON m.customer_id = p.customer_id;</text>
<text x="364" y="358" font-family="Fira Code, monospace" font-size="8" font-weight="700" fill="#A2A6C9" text-anchor="start">RESOLVED CANONICAL RESOURCES</text>
<rect x="364" y="370" width="708" height="96" fill="#02196E" stroke="#36457D" stroke-width="1"/>
<text x="378" y="396" font-family="Fira Code, monospace" font-size="9" font-weight="500" fill="#EDF2FB" text-anchor="start">uuid…customer  ← PostgreSQL alias public.customer</text>
<text x="378" y="420" font-family="Fira Code, monospace" font-size="9" font-weight="500" fill="#EDF2FB" text-anchor="start">uuid…segment   ← MySQL alias sales.segment</text>
<text x="378" y="444" font-family="Fira Code, monospace" font-size="8" font-weight="600" fill="#6DFF8B" text-anchor="start">One ScratchBird engine / one MGA authority</text>
