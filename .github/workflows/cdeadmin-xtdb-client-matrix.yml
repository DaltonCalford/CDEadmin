name: CDEadmin XTDB client matrix

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  xtdb-provider-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install provider contract dependencies
        run: >-
          python -m pip install
          "psycopg[c]==3.3.4"
          "pycodestyle==2.14.0"
      - name: Run XTDB provider and shared contracts
        run: >-
          python -m unittest -v
          tools.tests.test_cdeadmin_xtdb_provider
          tools.tests.test_cdeadmin_provider_tooling
          tools.tests.test_cdeadmin_actual_engine_pilots
          tools.tests.test_cdeadmin_endpoint_registration
          tools.tests.test_cdeadmin_result_renderers
      - name: Check provider Python style
        run: >-
          python -m pycodestyle
          web/pgadmin/cdeadmin/providers/xtdb
          tools/cdeadmin_xtdb_live_gate.py
          tools/tests/test_cdeadmin_xtdb_provider.py
