LoadModule wsgi_module modules/mod_wsgi.so
WSGIDaemonProcess cdeadmin processes=1 threads=25 python-home=/usr/cdeadmin/venv
WSGIScriptAlias /cdeadmin /usr/cdeadmin/web/CDEadmin.wsgi

<Directory /usr/cdeadmin/web/>
	WSGIProcessGroup cdeadmin
	WSGIApplicationGroup %{GLOBAL}
	<IfModule mod_authz_core.c>
		Require all granted
	</IfModule>
	<IfModule !mod_authz_core.c>
		Order Deny,Allow
		Deny from All
		Allow from 127.0.0.1
		Allow from ::1
	</IfModule>
</Directory>
